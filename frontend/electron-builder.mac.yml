    - zip
  category: public.app-category.entertainment
  minimumSystemVersion: '13.0'
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  artifactName: VisualPozdr-mac-${arch}-demo.zip
